name: Probe Sketchfab asset
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        shell: bash
        run: |
          set -euo pipefail
          URL="https://sketchfab.com/models/2389b2db6e874c4287f43c34caedd394/embed?autostart=1&ui_infos=0&ui_controls=0"
          curl -L -A "Mozilla/5.0" "$URL" -o /tmp/embed.html
          echo "HTML bytes: $(wc -c </tmp/embed.html)"
          python - <<'PY'
          import re, html
          s=open('/tmp/embed.html','r',errors='ignore').read()
          s=html.unescape(s)
          pats=[
            r'https://[^"\'<> ]+sketchfab[^"\'<> ]+',
            r'https://[^"\'<> ]+\.glb[^"\'<> ]*',
            r'https://[^"\'<> ]+\.gltf[^"\'<> ]*',
            r'https://[^"\'<> ]+\.bin[^"\'<> ]*',
            r'https://[^"\'<> ]+sketchfab-prod-media[^"\'<> ]+',
          ]
          found=[]
          for p in pats:
            for x in re.findall(p,s):
              if x not in found: found.append(x)
          for x in found[:200]:
            print(x)
          print("FOUND",len(found))
          for key in ['model_file','archive','gltf','osgjs','model-data','viewer']:
            print("KEY",key, s.lower().find(key.lower()))
          PY
