name: Probe direct GLB source
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe metadata
        shell: bash
        run: |
          set -euo pipefail
          curl -L -A "Mozilla/5.0" "https://sketchfab.com/models/2389b2db6e874c4287f43c34caedd394/embed?autostart=1" -o /tmp/embed.html
          python3 -c "import html; p='/tmp/embed.html'; s=html.unescape(open(p,errors='ignore').read()); open('/tmp/decoded.html','w').write(s)"
          grep -o -E '.{0,1000}glb_archive.{0,2500}' /tmp/decoded.html | head -10 || true
          grep -o -E '.{0,1000}archives.{0,2500}' /tmp/decoded.html | head -10 || true
          grep -o -E 'https://[^\"[:space:]<>]+(glb|gltf|zip)[^\"[:space:]<>]*' /tmp/decoded.html | head -50 || true
